<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="container card">
  <h2>👥 Teams</h2>

  <input id="teamName" placeholder="Team name">
  <button class="primary" type="button" onclick="addTeam()">Add Team</button>

  <div id="teamList"></div>
  
  <button class="primary mt-2" onclick="chooseFormat()">⚙️ Auto Generate Bracket</button>

  <button class="secondary mt-2" onclick="location.href='/tournament.html'">
    ← Back
  </button>
</div>

<div id="formatModal" class="modal hidden">
  <div class="modal-card">
    <h3>Choose Round Robin Format</h3>
    <input id="fieldCount" type="number" min="1" placeholder="Number of fields">
    <button class="primary" onclick="selectFormat(1)">
      Option 1 – Group Round Robin (2 Groups)
    </button>

    <button class="secondary mt-2" onclick="selectFormat(2)">
      Option 2 – Full Round Robin
    </button>

    <button class="danger mt-2" onclick="closeModal()">Cancel</button>
  </div>
</div>


<script src="/js/api.js"></script>
<script src="/js/teams.js"></script>
</body>
</html>
